<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="glow-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 52px; font-weight: 800; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 22px; font-weight: 400; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #38bdf8; }
    
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.08); opacity: 0.7; }
      100% { transform: scale(1); opacity: 0.3; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    
    .pulse-node { transform-origin: center; animation: pulse 4s infinite ease-in-out; }
    .floating-building { animation: float 6s infinite ease-in-out; }
    .data-stream { stroke-dasharray: 8 8; animation: dash 2s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />
  
  <!-- Grid -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="1">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200 M0 350 H1200" />
    <path d="M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400 M600 0 V400 M700 0 V400 M800 0 V400 M900 0 V400 M1000 0 V400 M1100 0 V400" />
  </g>

  <!-- Background Animated Graphic (Twin model on right, kept far from foreground title) -->
  <g transform="translate(850, 80)" opacity="0.85">
    <circle cx="100" cy="120" r="160" fill="url(#glow-blue)" class="pulse-node" />
    
    <g class="floating-building">
      <polygon points="100,20 180,60 180,220 100,180" fill="#1e293b" stroke="#38bdf8" stroke-width="2" opacity="0.9" />
      <polygon points="100,20 20,60 20,220 100,180" fill="#0f172a" stroke="#818cf8" stroke-width="2" opacity="0.9" />
      <polygon points="100,20 180,60 100,100 20,60" fill="#334155" stroke="#c084fc" stroke-width="2" opacity="0.9" />

      <line x1="20" y1="100" x2="100" y2="60" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
      <line x1="180" y1="100" x2="100" y2="60" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
      <line x1="20" y1="140" x2="100" y2="100" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
      <line x1="180" y1="140" x2="100" y2="100" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
      <line x1="20" y1="180" x2="100" y2="140" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
      <line x1="180" y1="180" x2="100" y2="140" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />

      <path d="M-40,160 Q 20,200 100,100 T 240,40" fill="none" stroke="#38bdf8" stroke-width="2" class="data-stream" />
      <path d="M20,260 Q 100,180 180,240" fill="none" stroke="#c084fc" stroke-width="2" class="data-stream" />

      <circle cx="100" cy="100" r="6" fill="#38bdf8" filter="url(#glow)" />
      <circle cx="20" cy="140" r="5" fill="#818cf8" filter="url(#glow)" />
      <circle cx="180" cy="100" r="5" fill="#c084fc" filter="url(#glow)" />
      <circle cx="100" cy="180" r="6" fill="#34d399" filter="url(#glow)" />
    </g>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(80, 0)">
    <rect x="0" y="60" width="280" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="14" y="83" class="badge-text">🏢 DIGITAL TWIN FOR BUILDINGS</text>

    <text x="0" y="160" class="title">Awesome Digital Twin</text>
    <text x="0" y="220" class="title" fill="url(#accent-grad)">For Buildings</text>

    <text x="0" y="275" class="subtitle">Curated SaaS Platforms, BIM/IFC Standards, IoT Fusion</text>
    <text x="0" y="305" class="subtitle">&amp; Open-Source Facility Operations Ecosystem</text>

    <rect x="0" y="335" width="120" height="4" rx="2" fill="url(#accent-grad)" />
  </g>
</svg>
 
